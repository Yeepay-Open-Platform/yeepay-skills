  - id: financial-order-remit-query
    name: 订单付款-订单查询
    scene: [loan-single]
    method: GET
    path: /rest/v1.0/financial/order/remit/query
    api_id: 6bc3aeb8f795451cae3e530296cd58d8
    doc_md: https://open.yeepay.com/docs-v3/api/get_rest_v1.0_financial_order_remit_query.md

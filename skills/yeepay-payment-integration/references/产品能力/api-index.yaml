    doc_md: https://open.yeepay.com/docs-v3/api/options_rest_v1.0_frontcashier_sign_import-card.md   # 注意：此接口前缀为 options_（实测）
  # —— 一键绑卡（网联查卡并签约；工行与非工行通知逻辑不同，见 金融/协议支付.md）

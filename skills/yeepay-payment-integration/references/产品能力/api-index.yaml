#   * 场景 md 见 references/产品能力/金融/{放款,信用卡还款,协议支付}.md
#   * 签约绑卡接口（frontcashier 分组）由协议支付与信用卡还款共用。
#   * 协议支付 1.0（cnppay）与 2.0（financial）为两套接口，下单与查询须配对使用。
#   * 退款相关接口在上方 refund 分组；交易日账单在 reconciliation 分组。
financial:
  # —— 放款：订单付款（单一资方对公快捷）
  - id: financial-order-remit-request
    name: 订单付款-付款
    scene: [loan-single]
    method: POST
    path: /rest/v1.0/financial/order/remit/request
    api_id: 44359a6f39ac431fbf0aeaddc3529000
    doc_md: https://open.yeepay.com/docs-v3/api/post_rest_v1.0_financial_order_remit_request.md

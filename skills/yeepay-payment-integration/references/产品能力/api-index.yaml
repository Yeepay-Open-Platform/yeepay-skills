    scene: [loan-joint]
    method: POST
    path: /rest/v1.0/financial/jointloan/request
    api_id: 298ac6bbc6c74404875a5772dc0fda8d
    doc_md: https://open.yeepay.com/docs-v3/api/post_rest_v1.0_financial_jointloan_request.md
    notify_spi: financial.join.loan.result.notify   # 索引提示；以 doc_md「结果通知」节为准
  - id: financial-jointloan-query
    name: 联合贷放款-查询
    scene: [loan-joint]
    method: POST
    path: /rest/v1.0/financial/jointloan/query
    api_id: cf89e48644ef49c79ae5271492ee290a
    doc_md: https://open.yeepay.com/docs-v3/api/post_rest_v1.0_financial_jointloan_query.md
  # —— 放款：账单与回单（bizType: ORDER_REMIT / JOIN_LOAN）
  - id: financial-trade-bill-download
    name: 金融交易账单下载
    scene: [loan-single, loan-joint]
    method: GET
    path: /yos/v1.0/financial/trade-bill/download
    api_id: 2274b595441d4ab18fa3d9149525f50d
    doc_md: https://open.yeepay.com/docs-v3/api/get_yos_v1.0_financial_trade-bill_download.md
  - id: financial-receipt-get
    name: 获取电子回单
    scene: [loan-single, loan-joint]
    method: POST
    path: /rest/v1.0/financial/receipt/get
    api_id: 83c14329240a44bd83ade25170f36136
    doc_md: https://open.yeepay.com/docs-v3/api/post_rest_v1.0_financial_receipt_get.md
    # rest 接口：响应 JSON 含 data（Base64）+ fileTypeSuffix，解码落盘；非 yos 文件流。协议支付 yos 回单见 trade-receipt-download。
  # —— 签约绑卡（协议支付与信用卡还款共用）
  - id: frontcashier-agreement-sign-request
    name: 协议支付-签约请求（四要素）
    scene: [sign, credit-card-repay]
    method: POST
    path: /rest/v1.0/frontcashier/agreement/sign/request
    api_id: 6575637d8b5b4c91a6d606dcfa0fa66f
    doc_md: https://open.yeepay.com/docs-v3/api/options_rest_v1.0_frontcashier_agreement_sign_request.md   # 注意：此接口前缀为 options_（实测）
  - id: frontcashier-agreement-sign-confirm
    name: 协议支付-签约确认
    scene: [sign, credit-card-repay]
    method: POST
    path: /rest/v1.0/frontcashier/agreement/sign/confirm
    api_id: 2b1ddd003b084620af965582afc9c319
    doc_md: https://open.yeepay.com/docs-v3/api/options_rest_v1.0_frontcashier_agreement_sign_confirm.md   # 注意：此接口前缀为 options_（实测）
